# =============================================================================
#  THE CAN MAPPING TABLE -- edit this file and nothing else.
# =============================================================================
#
# Which kernel CAN netdev each of the four arms is cabled to. Every script in
# this directory reads this table (Python via scripts/can_channels.py, shell via
# scripts/_can_map.sh), so changing a number here changes it everywhere at once.
#
# Format: one line per arm,
#
#     <can number>   <arm role>
#
# The number is the kernel-default netdev index: 4 means /sys/class/net/can4.
# (Writing "can4" instead of "4" also works.) The four arm roles are fixed and
# must each appear exactly once:
#
#     leader_left   leader_right   follower_left   follower_right
#
# Lines starting with # and blank lines are ignored.
#
# -----------------------------------------------------------------------------
# HOW TO RE-CHECK AFTER A REBOOT / REPLUG
# -----------------------------------------------------------------------------
# The USB-CAN adapters are enumerated in whatever order the kernel probes them,
# so these numbers can move. There are no udev persistent names any more (the
# rule matched on adapter serial, and every adapter is dual-channel, so the name
# kept landing on the un-cabled netdev of the pair). To re-derive the table:
#
#   1. Power all four arms, release the e-stops, and start teleop NOT at all.
#   2. python scripts/scan_can.py
#      It lists every netdev with its adapter, link state and motor count, and
#      prints the table lines to write. A leader answers 6 motors, a follower 7.
#      If a bus you expect is DOWN: sudo scripts/reset_all_can.sh, then re-scan.
#   3. Left vs right is the one thing the bus cannot tell you. Check it with
#         YAM_CAN_CHANNEL=canN scripts/run_leader_left.sh
#      and see which arm goes gravity-compensated (Ctrl-C to stop).
#   4. Write the four numbers into the table below.
#   5. sudo scripts/fix_can_links.sh && python scripts/check_arms.py
#
# Each adapter exposes TWO netdevs (the same adapter serial, USB interface 00
# and 01), but only one is wired. The other must stay DOWN -- while it is UP it
# absorbs part of the motors' replies and the arm looks half-dead on both
# channels. fix_can_links.sh finds it by USB serial and brings it down, so this
# table only ever needs the cabled channel.
# =============================================================================

6   leader_right
0   leader_left
4   follower_left
2   follower_right
