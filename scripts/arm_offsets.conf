# =============================================================================
#  PER-ARM ZERO-CALIBRATION CORRECTIONS -- edit this file and nothing else.
# =============================================================================
#
# Each DM motor stores its own zero in firmware, saved once at assembly time by
# holding the joint at its nominal pose and calling save_zero_position (see
# i2rt/motor_config_tool/set_zero.py). Two physically identical arms whose zeros
# were saved a couple of degrees apart therefore report DIFFERENT joint angles
# for the SAME physical pose -- and teleop copies the leader's angles onto the
# follower verbatim, so that difference shows up as the follower sitting slightly
# rotated from the leader. Nothing in the servo loop can see it: the follower
# tracks its commanded angle perfectly, the angle itself just means something
# else on that arm.
#
# This table is the correction. Each line is
#
#     <arm role>   <joint>   <degrees>
#
# and means "add <degrees> to what this arm reports for <joint>" -- equivalently,
# this arm reads <degrees> too LOW at a given physical pose. The correction is
# applied at the motor chain (i2rt/robots/get_robot.py, joint_offsets), so the
# arm's reported angles, its commands, its forward kinematics and its gravity
# compensation all move together into one consistent frame.
#
#     <arm role>  one of leader_left leader_right follower_left follower_right
#     <joint>     1..6 (arm joints; the gripper has no meaningful zero here)
#     <degrees>   signed, added to the reported angle
#
# Joints with no line here are uncorrected. Lines starting with # are ignored.
#
# -----------------------------------------------------------------------------
# HOW TO MEASURE
# -----------------------------------------------------------------------------
#   python scripts/leader_follower_offset.py --side right
#
# It brings the side's leader and follower up gravity-compensated, walks you
# through a mechanical reference (each joint pushed to both of its hard stops,
# whose midpoint is a repeatable physical zero that does not depend on your eye),
# and prints the lines to paste below. See that script's header for the details
# and for the by-eye fallback (--mode pose).
#
# Sign check after editing: re-run the measurement; every corrected joint should
# now read ~0.0 difference.
#
# -----------------------------------------------------------------------------
# NOTE ON ALREADY-RECORDED DATA
# -----------------------------------------------------------------------------
# A correction moves that arm's joint frame, so episodes recorded before it are
# offset by the same amount in both their observations and their actions. They
# stay self-consistent (replaying one now puts the arm where the operator meant
# it to be, which is the point), but a policy trained across the boundary sees
# the two frames as different. Re-record, or restrict training to one side of it.
# =============================================================================

# arm role         joint   degrees

